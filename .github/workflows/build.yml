name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild folders
        run: |
          for f in *__*; do
            n="${f//__//}"
            mkdir -p "$(dirname "$n")"
            mv "$f" "$n"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --console=plain > build.log 2>&1 || { grep -n -E "^e: |What went wrong" -A3 build.log | head -80; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
